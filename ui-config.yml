---
type: showroom
default_width: 30
persist_url_state: true
view_switcher:
  enabled: true
  default_mode: split
tabs:
  - name: OpenShift Console
    url: 'https://console-openshift-console.${DOMAIN}'
  - name: Terminal
    path: /wetty
    port: 443

# Provisioning must add Network, RAN, and GitOps tabs using resolved tenant URLs.
# Do not infer tenant hostnames from the shared cluster domain.
# Until then, use service details or the application namespace Routes.
